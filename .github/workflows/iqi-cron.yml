name: IQI Cron

# Coleta do IQI 2x/dia (ADR-012). Alternativa gratuita ao Vercel Cron (que exigiria
# plano Pro para 2 execucoes/dia). O GitHub Actions apenas dispara o endpoint
# /api/cron/iqi; toda a logica roda no servidor Next.
#
# GitHub Cron roda em UTC. Brasil = UTC-3 sem horario de verao:
#   11:00 UTC = 08:00 BRT  |  23:00 UTC = 20:00 BRT
# Obs.: agendamentos do GitHub Actions so disparam a partir da branch default (main)
# e podem atrasar alguns minutos sob carga — aceitavel para uma coleta 2x/dia.

on:
  schedule:
    - cron: '0 11,23 * * *'
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar coleta do IQI
        env:
          IQI_URL: https://wave.tallpa.com.br/api/cron/iqi
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS --max-time 120 -o /tmp/iqi.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" "${IQI_URL}")
          echo "HTTP ${code}"
          cat /tmp/iqi.json || true
          echo
          test "${code}" = "200"
