<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Maskable: gradiente full-bleed, "W" dentro da safe zone (80% central). -->
  <!-- PLACEHOLDER — substituir pela logo oficial da Wave Telecom. -->
  <defs>
    <linearGradient id="grad-mask" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#1E6BFF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#grad-mask)"/>
  <text x="256" y="340" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="230"
        fill="#051127">W</text>
</svg>
