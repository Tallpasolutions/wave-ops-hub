<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050814" />
    <title>Sem conexão | Wave Ops</title>
    <style>
      :root {
        --bg: #050814;
        --bg-1: #0a0f22;
        --text: #ffffff;
        --text-2: #9aa3bd;
        --cyan: #00d4ff;
        --blue: #1e6bff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 32px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .mark {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: linear-gradient(135deg, var(--cyan) 0%, var(--blue) 100%);
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 40px;
        color: #051127;
      }
      h1 {
        font-size: 20px;
        margin: 0;
      }
      p {
        color: var(--text-2);
        margin: 0;
        max-width: 320px;
        line-height: 1.5;
      }
      button {
        margin-top: 8px;
        border: 0;
        border-radius: 12px;
        padding: 12px 24px;
        font-size: 15px;
        font-weight: 600;
        color: #051127;
        background: linear-gradient(135deg, var(--cyan) 0%, var(--blue) 100%);
      }
    </style>
  </head>
  <body>
    <div class="mark">W</div>
    <h1>Você está sem conexão</h1>
    <p>Não foi possível carregar esta tela. Verifique sua internet e tente novamente.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </body>
</html>
